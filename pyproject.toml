[project]
name = "soda-stt"
version = "0.1.0"
description = "Chrome's on-device (offline) speech-to-text engine (SODA) as a Python library"
readme = "README.md"
authors = [
    { name = "cnmoro", email = "cnmoro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.29",
]

[project.scripts]
soda-stt = "soda_stt.cli:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=9.1.1",
]
